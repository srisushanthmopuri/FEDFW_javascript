<!-- Fetch API example
 fetch() is a modern way to make HTTP request in javascript returning a promis that 
 resolove to the responce object representation the response to the request 
 it is widly used for making  API calls and handling data asynchronously
 -->
 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Example</title>
</head>

<body>
    <h1>Fetch API Example</h1>
    <button onclick="fetchUsers()">Fetch Users</button>
    <div id="users"></div>

    <script>
        function fetchUsers() {
            fetch('https://jsonplaceholder.typicode.com/users/')
                .then(response => response.json())
                .then(data => {
                    const usersDiv = document.getElementById('users');
                    usersDiv.innerHTML = '';
                    data.forEach(user => {
                        const userDiv = document.createElement('div');
                        userDiv.innerHTML = <h2>${user.name}</h2><p>Email: ${user.email}</p><p>Phone: ${user.phone}</p>;
                        usersDiv.appendChild(userDiv);
                    });
                })
                .catch(error => {
                    console.error('Error fetching users:', error);
                });
        }
    </script>
</body>

</html>
